name: Report an action
description: Tell us what you or your group did, with numbers if you have them.
title: "Report: "
labels: ["type:report"]
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Share the city or region, never a home address, phone number or anyone else's personal details.
        Numbers are counted as "reported" until a maintainer checks them and adds the `verified` label.
  - type: dropdown
    id: scale
    attributes:
      label: Scale
      description: Who did this?
      options:
        - Person
        - Household
        - Neighbourhood
        - City or region
        - Nation
        - Global
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe what was done, when, and what you learned. Link the task issue if there is one.
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: City or region
      description: For example "Leeds, UK". Leave out street addresses.
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: People involved
      description: A number, such as 12.
  - type: input
    id: households
    attributes:
      label: Households reached
      description: A number, such as 40.
  - type: input
    id: kwh
    attributes:
      label: Energy saved or generated per year (kWh)
      description: A number. Estimates are fine. Say how you worked it out in the description above.
  - type: checkboxes
    id: needs
    attributes:
      label: Needs this helps with
      options:
        - label: Food
        - label: Water
        - label: Shelter
        - label: Energy
        - label: Health
        - label: Education
        - label: Connection
        - label: Mobility
        - label: Income
        - label: Safety
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: A link to a photo, a bill summary, a news story or a meeting record, if you have one.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no private information about me or anyone else that I have not been given permission to share.
          required: true
