name: Start or list a local chapter
description: A chapter is a group of people working on the plan in one place.
title: "Chapter: "
labels: ["type:chapter"]
body:
  - type: markdown
    attributes:
      value: |
        Listing a chapter helps neighbours find each other. This issue is public, so please don't post personal phone numbers or email addresses. People can reach you by replying here, using @mentions, or in Discussions.
  - type: input
    id: region
    attributes:
      label: City or region
      description: For example "Leeds, UK" or "Eastside, Portland". No street addresses.
    validations:
      required: true
  - type: dropdown
    id: scale
    attributes:
      label: Scale
      options:
        - Neighbourhood
        - City or region
        - Nation
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: What you plan to start with
      description: Pick one or two tasks from the board and say why.
    validations:
      required: true
  - type: textarea
    id: meeting
    attributes:
      label: How and when you meet
      description: For example "first Saturday of the month at the library". Online is fine.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of conduct
      options:
        - label: I will follow the code of conduct, including the commitment to peaceful methods.
          required: true
