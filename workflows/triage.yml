name: Triage and claims

# 1. Labels new issues from what the issue form says and welcomes the author.
# 2. Lets anyone comment /claim on a task to say they are on it, and /release to step back.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (issue.user.type === "Bot") return;
            const names = issue.labels.map((l) => l.name);
            const body = issue.body || "";

            // Read "### Label" sections written by issue forms.
            const form = {};
            for (const part of body.split(/^###\s+/m).slice(1)) {
              const nl = part.indexOf("\n");
              if (nl === -1) continue;
              form[part.slice(0, nl).trim()] = part.slice(nl + 1).trim();
            }

            const scaleMap = {
              "Person": "scale:person",
              "Household": "scale:household",
              "Neighbourhood": "scale:neighbourhood",
              "City or region": "scale:city-region",
              "Nation": "scale:national",
              "Global": "scale:global",
            };
            const toAdd = [];
            if (scaleMap[form["Scale"]]) toAdd.push(scaleMap[form["Scale"]]);

            const phase = (form["Phase"] || "").match(/^([0-3]):/);
            if (phase) toAdd.push(`phase:${phase[1]}`);

            // Checked boxes look like "- [x] Food".
            for (const line of (form["Needs this helps with"] || "").split("\n")) {
              const m = line.match(/^- \[[xX]\]\s+(\w+)/);
              if (m) toAdd.push(`need:${m[1].toLowerCase()}`);
            }

            if (toAdd.length) {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: [...new Set(toAdd)],
              });
            }

            const replies = {
              "type:report": "Thank you for the report. A maintainer will check the numbers and add the `verified` label so they count towards verified impact. If you can add evidence, please do.",
              "type:chapter": "Thanks for listing your chapter. Neighbours can find you here and reply to make contact. Pick a first task from the board and comment `/claim` on it.",
              "type:proposal": "Thanks for the proposal. Maintainers and other contributors will comment on it. If it is accepted, it will be relabelled as a task.",
              "type:data": "Thank you. A maintainer will check the source and update the dashboard.",
            };
            const type = names.find((n) => replies[n]);
            if (type) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body: replies[type],
              });
            }

  claims:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            if (comment.user.type === "Bot") return;

            const command = (comment.body || "").trim().split(/\s+/)[0].toLowerCase();
            if (command !== "/claim" && command !== "/release") return;

            const names = issue.labels.map((l) => l.name);
            if (!names.includes("type:task")) return;

            const maintainer = ["OWNER", "MEMBER", "COLLABORATOR"].includes(comment.author_association);
            const claimed = names.includes("status:claimed");

            // Find who holds the claim, from the last marker the workflow left.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue.number, per_page: 100,
            });
            let holder = null;
            for (const c of comments) {
              const m = (c.body || "").match(/<!-- claimed-by: ([A-Za-z0-9-]+) -->/);
              if (m && c.user.type === "Bot") holder = m[1];
              if ((c.body || "").includes("<!-- released -->") && c.user.type === "Bot") holder = null;
            }

            if (command === "/claim") {
              if (claimed && holder) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: `@${comment.user.login} this task is already claimed by @${holder}. You are welcome to offer to help them, or pick another task.`,
                });
                return;
              }
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ["status:claimed"],
              });
              if (names.includes("help wanted")) {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name: "help wanted",
                });
              }
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `@${comment.user.login} has claimed this task. Share progress here, and open a report when something is done. Comment \`/release\` if you need to step back.\n<!-- claimed-by: ${comment.user.login} -->`,
              });
            } else {
              if (!claimed) return;
              if (holder && holder !== comment.user.login && !maintainer) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: `@${comment.user.login} only @${holder} or a maintainer can release this claim.`,
                });
                return;
              }
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue.number, name: "status:claimed",
              });
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ["help wanted"],
              });
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `This task is open again. Thank you @${holder || comment.user.login} for what you did.\n<!-- released -->`,
              });
            }
